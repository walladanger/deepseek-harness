<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Desktop launcher</title>
  <link rel="stylesheet" href="chrome.css">
  <script src="chrome.js" defer></script>
</head>
<body>
  <header>
    <div id="drag"><span id="name">Desktop launcher</span><span id="status">Starting…</span></div>
    <button id="minimize" aria-label="Minimize" title="Minimize">&#x2212;</button>
    <button id="maximize" aria-label="Maximize or restore" title="Maximize or restore">&#x25a1;</button>
    <button id="close" aria-label="Close" title="Close">&#x2715;</button>
  </header>
</body>
</html>
