[package]
name = "dsh-tauri-desktop"
version = "0.1.0"
description = "Lightweight Tauri desktop shell that shows the dsh web UI in a single native window, backed by a background dsh --profile web process."
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["webview-data-url", "unstable"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[[bin]]
name = "dsh-tauri-desktop"
path = "src/main.rs"
