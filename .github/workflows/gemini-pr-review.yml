name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: gemini-pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
  # A newer push or comment supersedes an in-flight review of a stale
  # diff; queuing every push instead would burn API quota on reviews
  # nobody reads.
  cancel-in-progress: true

jobs:
  review:
    # Fork pull_request runs never receive repository secrets, so an
    # automatic review only makes sense against this repository's own
    # branches; a fork PR still gets a review through the gated
    # @gemini-cli /review comment path below.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@gemini-cli') &&
       contains(github.event.comment.body, '/review') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.comment.author_association == 'MEMBER'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the PR's actual head consistently for both trigger
          # paths. github.ref for a pull_request event resolves to
          # refs/pull/N/merge, which GitHub never generates for a PR with
          # merge conflicts and which reviews a different tree than the
          # head commit an issue_comment-triggered run inspects.
          ref: >-
            refs/pull/${{ github.event.pull_request.number ||
                           github.event.issue.number }}/head
          fetch-depth: 0

      # A fork PR's own package.json scripts, Makefile, or repository
      # tooling would otherwise run under Gemini CLI's headless execution
      # with this job's secrets and pull-requests:write/issues:write
      # permissions in scope; verify the PR's head repository is this
      # repository's own before anything from its tree is used. (The
      # pull_request trigger's `if:` above already guarantees this for that
      # path; issue_comment's payload carries no head-repository field, so
      # it needs this runtime check.)
      - name: Verify the PR head is this repository's own branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number=${{ github.event.pull_request.number || github.event.issue.number }}
          head_repo_full=$(gh pr view "${pr_number}" --json headRepository --jq '.headRepository.nameWithOwner')
          if [ "${head_repo_full}" != "${{ github.repository }}" ]; then
            echo "::error::PR #${pr_number} head is an external fork (${head_repo_full}); gemini-pr-review does not check out fork content. Ask a maintainer to review it manually."
            exit 1
          fi

      # .gemini/ and .env are stripped even though the checkout above is
      # now verified to be this repository's own branch, guarding against a
      # compromised or stale branch. .agents/ is deliberately left alone:
      # a PR may legitimately be adding or editing skills and Agent Notes
      # under it, and this job never commits, so there is nothing to
      # protect against here beyond the collaborator gate already above.
      - name: Remove untrusted workspace configuration
        run: rm -rf .gemini .env

      # google-github-actions/run-gemini-cli's own env: block does not
      # reach the token into Gemini CLI's shell tool, which strips
      # GH_TOKEN/GITHUB_TOKEN from spawned subprocesses; authenticate gh
      # at the system level instead so `gh pr review`/`gh pr comment`
      # keep working from inside the agent's shell calls. setup-git wires
      # the same credential into git itself, for any git operation beyond
      # the push actions/checkout already configured a token for.
      - name: Authenticate GitHub CLI
        run: |
          echo "${{ github.token }}" | gh auth login --with-token
          gh auth setup-git

      - name: Run Gemini CLI review
        uses: google-github-actions/run-gemini-cli@v0
        env:
          # The checked-out CI workspace is never interactively trusted, so
          # Gemini CLI's headless trusted-folder check must be bypassed here.
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_CLI_KEY }}
          github_pr_number: ${{ github.event.pull_request.number || github.event.issue.number }}
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number || github.event.issue.number }}
            in this repository. Fetch the diff, review it for correctness bugs, security issues, and
            deviations from this repository's AGENTS.md conventions. Post your findings as a single PR
            review comment. Do not push any code changes in this workflow — comment only.
