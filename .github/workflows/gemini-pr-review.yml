name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: gemini-pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    # Fork pull_request runs never receive repository secrets, so an
    # automatic review only makes sense against this repository's own
    # branches; a fork PR still gets a review through the gated
    # @gemini-cli /review comment path below.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@gemini-cli') &&
       contains(github.event.comment.body, '/review') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.comment.author_association == 'MEMBER'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A PR comment's default checkout is the base branch; check out
          # the PR's own head so the diff being reviewed actually exists.
          ref: >-
            ${{ github.event.issue.pull_request &&
                format('refs/pull/{0}/head', github.event.issue.number) ||
                github.ref }}
          fetch-depth: 0

      # The checked-out ref may be an external fork's head, whose .gemini/
      # and .env content Gemini CLI would otherwise load and execute with
      # this job's GEMINI_CLI_KEY in scope.
      - name: Remove untrusted workspace configuration
        run: rm -rf .gemini .env

      - name: Run Gemini CLI review
        uses: google-github-actions/run-gemini-cli@v0
        env:
          # The checked-out CI workspace is never interactively trusted, so
          # Gemini CLI's headless trusted-folder check must be bypassed here.
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_CLI_KEY }}
          github_pr_number: ${{ github.event.pull_request.number || github.event.issue.number }}
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number || github.event.issue.number }}
            in this repository. Fetch the diff, review it for correctness bugs, security issues, and
            deviations from this repository's AGENTS.md conventions. Post your findings as a single PR
            review comment. Do not push any code changes in this workflow — comment only.
