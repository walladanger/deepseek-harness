# Builds the single-window Tauri desktop shell (apps/tauri-desktop) into an
# MSI and NSIS installer. Separate from ci.yml because this is a Rust/Tauri
# build on windows-latest, not part of the pnpm/Node workspace matrix. Called
# from ci.yml as a reusable workflow (`needs` cannot cross workflow files, so
# this is how its job joins ci.yml's `all-checks-passed` aggregate) and kept
# runnable manually via workflow_dispatch.
name: Tauri Desktop Installer

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/tauri-desktop

jobs:
  build:
    name: Build installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/tauri-desktop/target
          key: tauri-desktop-cargo-${{ runner.os }}-${{ hashFiles('apps/tauri-desktop/Cargo.lock') }}
          restore-keys: |
            tauri-desktop-cargo-${{ runner.os }}-

      - name: Run unit tests
        run: cargo test

      - name: Build MSI and NSIS installers
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/tauri-desktop
          args: --bundles msi,nsis

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dsh-tauri-desktop-installers
          path: |
            apps/tauri-desktop/target/release/bundle/msi/*.msi
            apps/tauri-desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error
