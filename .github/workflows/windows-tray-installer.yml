# Builds the windowless Windows tray wrapper (apps/windows-tray) into an
# MSI and NSIS installer. Separate from ci.yml because this is a Rust/Tauri
# build on windows-latest, not part of the pnpm/Node workspace matrix.
name: Windows Tray Installer

on:
  pull_request:
    paths:
      - '.github/workflows/windows-tray-installer.yml'
      - 'apps/windows-tray/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/windows-tray-installer.yml'
      - 'apps/windows-tray/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/windows-tray

jobs:
  build:
    name: Build installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/windows-tray/target
          key: windows-tray-cargo-${{ runner.os }}-${{ hashFiles('apps/windows-tray/Cargo.lock') }}
          restore-keys: |
            windows-tray-cargo-${{ runner.os }}-

      - name: Build MSI and NSIS installers
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/windows-tray
          args: --bundles msi,nsis

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dsh-windows-tray-installers
          path: |
            apps/windows-tray/target/release/bundle/msi/*.msi
            apps/windows-tray/target/release/bundle/nsis/*.exe
          if-no-files-found: error
